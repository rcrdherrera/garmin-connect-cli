name: Deploy Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
      - name: Pull latest code
        run: |
          cd /opt/garmin-connect-cli
          git fetch origin
          git reset --hard origin/main

      - name: Sync dependencies
        run: |
          cd /opt/garmin-connect-cli
          [ -f .venv/bin/pip ] || python3 -m venv .venv
          .venv/bin/pip install -e ".[server]" -q

      - name: Restart service
        run: sudo systemctl restart garmincoach

      - name: Verify
        run: |
          sleep 2
          systemctl is-active garmincoach
          echo "Server restarted successfully."
