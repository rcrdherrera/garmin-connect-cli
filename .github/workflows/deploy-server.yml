name: Deploy Server

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
      - name: Pull latest code
        run: |
          cd /opt/garmin-connect-cli
          git fetch origin
          git reset --hard origin/main

      - name: Sync dependencies
        run: |
          cd /opt/garmin-connect-cli
          [ -f .venv/bin/pip ] || python3 -m venv .venv
          .venv/bin/pip install -e ".[server]" -q

      - name: Restart service
        run: sudo systemctl restart garmincoach

      - name: Verify
        run: |
          sleep 2
          systemctl is-active garmincoach
          curl -sf --max-time 5 http://localhost:8765/health && echo "HTTP health check passed." || echo "Warning: HTTP health check failed."
