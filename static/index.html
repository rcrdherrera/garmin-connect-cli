<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="GarminCoach">
  <meta name="theme-color" content="#050505">
  <title>GarminCoach</title>
  <style>
    /* ── Design tokens ──────────────────────────────────────── */
    :root {
      --bg:       #060606;
      --card:     #0e0e0e;
      --card2:    #161616;
      --border:   rgba(255,255,255,0.10);
      --border-s: rgba(255,255,255,0.24);
      --red:      #E8000B;
      --red-dim:  rgba(232,0,11,0.10);
      --red-glow: rgba(232,0,11,0.38);
      --text:     #f0f0f0;
      --dim:      rgba(255,255,255,0.46);
      --muted:    rgba(255,255,255,0.24);
      --faint:    rgba(255,255,255,0.07);
      --orange:   #FF8500;
      --green:    #00C96A;
      --blue:     #0A84FF;
    }
    *, *::before, *::after {
      box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    html { height: 100%; }
    body {
      height: 100%; height: -webkit-fill-available;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      overflow: hidden; -webkit-text-size-adjust: 100%;
    }
    button, [role="button"] { cursor: pointer; }

    /* ── Shell ──────────────────────────────────────────────── */
    #app { display: flex; flex-direction: column; height: 100%; height: -webkit-fill-available; }

    /* ── Header ─────────────────────────────────────────────── */
    .header {
      flex-shrink: 0; display: flex; align-items: flex-end; justify-content: space-between;
      padding: env(safe-area-inset-top, 0px) 16px 12px;
      min-height: calc(52px + env(safe-area-inset-top, 0px));
      background: var(--bg); border-bottom: 2px solid var(--border);
    }
    .header-left   { display: flex; align-items: center; gap: 8px; }
    .header-title  { font-size: 12px; font-weight: 900; letter-spacing: 3.5px; text-transform: uppercase; }
    .header-actions { display: flex; gap: 2px; align-items: center; }
    .icon-btn {
      background: none; border: none; color: rgba(255,255,255,0.55); cursor: pointer;
      min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center;
    }
    .icon-btn.red { color: var(--red); }
    .icon-btn svg  { width: 20px; height: 20px; fill: currentColor; }
    .back-btn {
      display: flex; align-items: center; gap: 6px; background: none; border: none;
      color: var(--red); font-size: 12px; font-weight: 900; letter-spacing: 1px;
      text-transform: uppercase; cursor: pointer; padding: 6px 4px; min-height: 44px;
    }
    .back-btn svg { width: 16px; height: 16px; fill: currentColor; }

    /* ── Tab content ─────────────────────────────────────────── */
    .tab-content { flex: 1; overflow: hidden; position: relative; }
    .tab-panel {
      position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch; display: none; flex-direction: column;
      scrollbar-width: none;
    }
    .tab-panel::-webkit-scrollbar { display: none; }
    .tab-panel.active { display: flex; }

    /* ── Bottom tab bar ──────────────────────────────────────── */
    .tabbar {
      flex-shrink: 0; display: flex;
      height: calc(56px + env(safe-area-inset-bottom, 0px));
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: var(--bg); border-top: 2px solid var(--border);
    }
    .tab-btn {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; background: none; border: none; cursor: pointer;
      color: var(--muted); font-size: 9px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase;
      transition: color .12s; position: relative;
    }
    .tab-btn.active { color: var(--red); }
    .tab-btn.active::after { content:''; position:absolute; top:0; left:20%; right:20%; height:2px; background:var(--red); border-radius: 0 0 2px 2px; }
    .tab-btn svg    { width: 22px; height: 22px; fill: currentColor; }

    /* ── Layout helpers ──────────────────────────────────────── */
    .pad  { padding: 12px 16px; }
    .gap  { display: flex; flex-direction: column; gap: 10px; }
    .row  { display: flex; gap: 10px; }
    .row > * { flex: 1; min-width: 0; }

    /* ── Cards ───────────────────────────────────────────────── */
    .card {
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: 16px; padding: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.45);
    }

    /* ── Metric ──────────────────────────────────────────────── */
    .metric-label {
      display: flex; align-items: center; gap: 5px;
      font-size: 9px; font-weight: 900; letter-spacing: 2px; color: var(--dim); text-transform: uppercase;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .metric-value { font-size: 28px; font-weight: 900; line-height: 1; margin-top: 6px; font-variant-numeric: tabular-nums; letter-spacing: -0.5px; }
    .metric-unit  { font-size: 13px; font-weight: 400; color: var(--dim); letter-spacing: 0; }
    .metric-sub   { font-size: 12px; color: var(--dim); margin-top: 3px; }

    /* ── Readiness ring ──────────────────────────────────────── */
    .readiness-card {
      background: var(--card); border: 1.5px solid var(--border); border-radius: 20px;
      padding: 22px 18px; display: flex; align-items: center; gap: 22px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.55);
    }
    .ring-svg   { width: 100px; height: 100px; flex-shrink: 0; }
    .ring-track { fill: none; stroke: rgba(255,255,255,0.06); stroke-width: 9; }
    .ring-fill  { fill: none; stroke-width: 9; stroke-linecap: round; }
    .ring-val   { fill: #fff; font-family: -apple-system, sans-serif; font-weight: 900; font-size: 24px; }
    .readiness-level    { font-size: 19px; font-weight: 900; margin-top: 5px; letter-spacing: 0.3px; }
    .readiness-feedback { font-size: 13px; color: var(--dim); margin-top: 6px; line-height: 1.5; }

    /* ── HRV badge ───────────────────────────────────────────── */
    .hrv-badge { padding: 3px 10px; border-radius: 20px; font-size: 9px; font-weight: 900; letter-spacing: 0.8px; text-transform: uppercase; }
    .hrv-badge.BALANCED   { background: rgba(52,199,89,0.12); border: 1px solid rgba(52,199,89,0.3); color: var(--green); }
    .hrv-badge.UNBALANCED { background: rgba(255,149,0,0.12); border: 1px solid rgba(255,149,0,0.3); color: var(--orange); }
    .hrv-badge.LOW        { background: rgba(255,31,31,0.12); border: 1px solid rgba(255,31,31,0.3); color: var(--red); }

    /* ── Section divider ─────────────────────────────────────── */
    .sec-div { display: flex; align-items: center; gap: 8px; padding: 10px 0 2px; }
    .sec-bar  { width: 3px; height: 13px; background: var(--red); border-radius: 1px; flex-shrink: 0; }
    .sec-lbl  { font-size: 9px; font-weight: 900; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; }

    /* ── Banners ─────────────────────────────────────────────── */
    .banner { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px; }
    .banner.stale { background: rgba(255,133,0,0.06); border: 1.5px solid rgba(255,133,0,0.25); }
    .banner.error { background: var(--card); border: 1.5px solid rgba(232,0,11,0.35); }
    .banner-bar   { width: 3px; align-self: stretch; border-radius: 1px; flex-shrink: 0; background: var(--red); }

    /* ── Filter bar (Training tab) ───────────────────────────── */
    .filter-bar {
      flex-shrink: 0; background: var(--bg); border-bottom: 2px solid var(--border);
      padding: 8px 16px; display: flex; flex-direction: column; gap: 6px;
    }
    .filter-row { display: flex; gap: 5px; align-items: center; }
    .fchip {
      padding: 0 14px; height: 30px; border: 1.5px solid var(--border); border-radius: 20px;
      background: transparent; color: var(--dim);
      font-size: 10px; font-weight: 900; letter-spacing: 0.5px; text-transform: uppercase;
      cursor: pointer; white-space: nowrap; transition: border-color .1s, color .1s, background .1s;
      flex-shrink: 0;
    }
    .fchip.active {
      border-color: var(--red); color: var(--red); background: var(--red-dim);
    }
    .filter-sep {
      width: 1.5px; height: 18px; background: var(--border); margin: 0 3px; flex-shrink: 0;
    }

    /* ── Chart ───────────────────────────────────────────────── */
    .chart-wrap {
      background: var(--card); border: 1.5px solid var(--border); border-radius: 16px;
      padding: 16px 16px 12px; overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.45);
    }
    .chart-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .chart-ttl { font-size: 9px; font-weight: 900; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; }
    .chart-total { font-size: 24px; font-weight: 900; }
    .chart-sub { font-size: 11px; color: var(--dim); margin-top: 1px; }
    .chart-svg { display: block; width: 100%; overflow: visible; }

    /* ── Training stats strip ────────────────────────────────── */
    .stats-strip {
      display: flex; gap: 0; background: var(--card); border: 1.5px solid var(--border);
      border-radius: 14px; overflow: hidden;
    }
    .stat-cell {
      flex: 1; padding: 10px 12px; border-right: 1.5px solid var(--border);
      text-align: center;
    }
    .stat-cell:last-child { border-right: none; }
    .stat-v { font-size: 16px; font-weight: 900; }
    .stat-l { font-size: 9px; font-weight: 700; letter-spacing: 1px; color: var(--dim); text-transform: uppercase; margin-top: 2px; }

    /* ── Activity card ───────────────────────────────────────── */
    .act-item {
      background: var(--card); border: 1.5px solid var(--border); border-radius: 16px;
      padding: 14px; cursor: pointer; transition: border-color .12s;
      box-shadow: 0 2px 12px rgba(0,0,0,0.4);
    }
    .act-item:active { border-color: var(--border-s); }
    .act-hdr  { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .act-name { font-size: 14px; font-weight: 700; }
    .act-type { font-size: 9px; font-weight: 900; letter-spacing: 1.2px; color: var(--dim); text-transform: uppercase; margin-top: 3px; }
    .act-date { font-size: 10px; color: var(--dim); font-weight: 700; letter-spacing: 0.5px; }
    .act-stats { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
    .st-val   { font-size: 15px; font-weight: 900; }
    .st-lbl   { font-size: 9px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.8px; font-weight: 700; margin-top: 1px; }
    .zone-bar { display: flex; height: 3px; border-radius: 0; overflow: hidden; margin-top: 10px; gap: 1px; }
    .zone-seg { height: 100%; }

    /* ── Analyze button on act card ──────────────────────────── */
    .analyze-btn {
      padding: 4px 12px; height: 26px; background: transparent;
      border: 1.5px solid var(--border); border-radius: 20px;
      color: var(--dim); font-size: 9px; font-weight: 900; letter-spacing: 0.8px;
      text-transform: uppercase; cursor: pointer; white-space: nowrap;
      transition: border-color .1s, color .1s;
    }
    .analyze-btn:hover { border-color: var(--red); color: var(--red); }

    /* ── Detail panel (overlays the list) ───────────────────── */
    .detail-panel {
      position: absolute; inset: 0; background: var(--bg);
      overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
      scrollbar-width: none; display: none; flex-direction: column;
      z-index: 10;
    }
    .detail-panel::-webkit-scrollbar { display: none; }
    .detail-panel.open { display: flex; }

    /* ── Activity detail layout ──────────────────────────────── */
    .detail-act-name { font-size: 18px; font-weight: 900; }
    .detail-act-type { font-size: 9px; font-weight: 900; letter-spacing: 1.5px; color: var(--dim); text-transform: uppercase; margin-top: 3px; }
    .detail-stats-grid {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2px;
      background: var(--border); border: 1.5px solid var(--border); border-radius: 14px;
      overflow: hidden;
    }
    .detail-stat { background: var(--card); padding: 12px 14px; }
    .detail-stat-v { font-size: 18px; font-weight: 900; }
    .detail-stat-l { font-size: 9px; font-weight: 900; letter-spacing: 1px; color: var(--dim); text-transform: uppercase; margin-top: 2px; }

    /* ── Spinner ─────────────────────────────────────────────── */
    .spinner { width: 26px; height: 26px; border: 2.5px solid rgba(255,31,31,0.18); border-top-color: var(--red); border-radius: 50%; }
    .spinner.sm { width: 16px; height: 16px; border-width: 2px; }
    @media (prefers-reduced-motion: no-preference) {
      .spinner { animation: spin .7s linear infinite; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-card {
      background: var(--card); border: 1.5px solid var(--border); border-radius: 16px;
      padding: 40px; display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .loading-lbl { font-size: 10px; font-weight: 900; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; text-align: center; }

    /* ── Empty state ─────────────────────────────────────────── */
    .empty { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 60px 40px; text-align: center; }
    .empty-title { font-size: 24px; font-weight: 900; color: var(--faint); text-transform: uppercase; letter-spacing: 3px; }
    .empty-sub   { font-size: 13px; color: var(--muted); }

    /* ── Chat ────────────────────────────────────────────────── */
    .chat-scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding: 6px 0 4px; }
    .chat-scroll::-webkit-scrollbar { display: none; }
    .bwrap { padding: 3px 16px; }
    .bubble {
      display: inline-block; max-width: calc(100% - 60px);
      padding: 10px 14px; font-size: 15px; line-height: 1.55; border-radius: 18px; word-break: break-word;
    }
    .bubble.user      { background: var(--red); color: #fff; border-radius: 18px 18px 4px 18px; margin-left: auto; display: block; box-shadow: 0 2px 12px rgba(232,0,11,0.35); }
    .bubble.assistant { background: var(--card2); border: 1.5px solid var(--border); border-radius: 4px 18px 18px 18px; }
    .bubble .mh  { font-size: 9px; font-weight: 900; letter-spacing: 1.5px; color: var(--dim); text-transform: uppercase; display: flex; align-items: center; gap: 6px; margin: 10px 0 3px; }
    .bubble .mh::before { content: ''; width: 3px; height: 11px; background: var(--red); border-radius: 1px; flex-shrink: 0; }
    .bubble .mh:first-child { margin-top: 0; }
    .bubble .ml  { margin: 1px 0; }
    .bubble .mb  { display: flex; gap: 6px; margin: 2px 0; }
    .bubble .mb::before { content: '—'; color: var(--red); flex-shrink: 0; }
    .bubble .mr  { height: 1px; background: var(--border); margin: 8px 0; }
    .bubble .msp { height: 5px; }
    .bubble strong { color: #fff; font-weight: 700; }
    .bubble code   { background: rgba(255,255,255,0.1); padding: 1px 5px; border-radius: 3px; font-family: 'SF Mono', monospace; font-size: 13px; }

    /* Typing dots */
    .typing { display: inline-flex; gap: 5px; padding: 12px 14px; background: var(--card2); border: 1.5px solid var(--border); border-radius: 4px 18px 18px 18px; }
    .tdot   { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.4); }
    @media (prefers-reduced-motion: no-preference) {
      .tdot { animation: tbounce 1.2s ease-in-out infinite; }
      .tdot:nth-child(2) { animation-delay: .15s; }
      .tdot:nth-child(3) { animation-delay: .30s; }
    }
    @keyframes tbounce { 0%,60%,100% { transform: translateY(4px); } 30% { transform: translateY(-4px); } }

    /* ── Input bar ───────────────────────────────────────────── */
    .input-bar {
      flex-shrink: 0; border-top: 2px solid var(--border); padding: 10px 12px;
      padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
      background: var(--bg); display: flex; align-items: flex-end; gap: 8px;
    }
    .ifield {
      flex: 1; background: var(--card2); border: 1.5px solid var(--border); border-radius: 20px;
      padding: 10px 16px; color: var(--text); font-size: 15px; font-family: inherit;
      resize: none; outline: none; max-height: 120px; overflow-y: auto; line-height: 1.4;
    }
    .ifield::placeholder { color: var(--muted); }
    .ifield:focus { border-color: rgba(255,255,255,0.22); }
    .send-btn {
      background: none; border: none; cursor: pointer; color: var(--red); padding: 0;
      display: flex; flex-shrink: 0; min-width: 44px; min-height: 44px; align-items: center; justify-content: center;
    }
    .send-btn:disabled { color: var(--faint); pointer-events: none; }
    .send-btn svg { width: 36px; height: 36px; fill: currentColor; }

    /* ── Action button ───────────────────────────────────────── */
    .abtn {
      padding: 13px 20px; min-height: 46px; background: var(--red); border: none; border-radius: 14px;
      color: #fff; font-size: 11px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 4px 16px rgba(232,0,11,0.4);
      transition: transform .1s, box-shadow .1s;
    }
    .abtn:active { transform: scale(0.98); box-shadow: 0 1px 6px rgba(232,0,11,0.3); }
    .abtn:disabled { opacity: 0.45; pointer-events: none; }
    .abtn.full  { width: 100%; }
    .abtn.ghost { background: transparent; border: 1.5px solid var(--border); color: var(--dim); box-shadow: none; }

    /* ── Plan card ───────────────────────────────────────────── */
    .plan-row { background: var(--card); border: 1.5px solid var(--border); border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; }

    /* ── Upload bar ──────────────────────────────────────────── */
    .upload-btn {
      width: 100%; padding: 13px; background: var(--red); border: none;
      color: #fff; font-size: 11px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .upload-btn:disabled { opacity: 0.5; }
    .upload-done { padding: 10px 16px; background: rgba(52,199,89,0.06); border-top: 1.5px solid rgba(52,199,89,0.2); border-bottom: 1.5px solid rgba(52,199,89,0.2); }
    .upload-done-ttl { font-size: 9px; font-weight: 900; letter-spacing: 2px; color: var(--green); text-transform: uppercase; margin-bottom: 4px; }
    .upload-done-row { display: flex; justify-content: space-between; font-size: 12px; color: rgba(255,255,255,0.7); margin: 2px 0; }

    /* ── Suggestions ─────────────────────────────────────────── */
    .sug-btn {
      width: 100%; min-height: 48px; padding: 12px 14px; background: var(--card);
      border: 1.5px solid var(--border); border-radius: 14px;
      text-align: left; display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; color: rgba(255,255,255,0.75); font-size: 14px; font-family: inherit; gap: 12px;
      transition: border-color .12s;
    }
    .sug-btn:active { border-color: var(--border-s); }
    .sug-arrow { color: var(--red); flex-shrink: 0; font-size: 14px; }

    /* ── Conv history items ──────────────────────────────────── */
    .conv-item {
      background: var(--card); border: 1.5px solid var(--border); border-radius: 14px;
      padding: 12px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 3px;
      transition: border-color .12s;
    }
    .conv-item:active { border-color: var(--border-s); }
    .conv-badge {
      font-size: 8px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase;
      padding: 2px 8px; border-radius: 20px; background: var(--faint); color: var(--dim); white-space: nowrap;
      border: 1px solid var(--border);
    }

    /* ── Chip rows (Coach tab) ───────────────────────────────── */
    .chip-rows-wrap {
      flex-shrink: 0; background: var(--bg); border-bottom: 2px solid var(--border);
      padding: 8px 0 10px;
    }
    .chip-section-lbl {
      font-size: 9px; font-weight: 900; letter-spacing: 1.5px; color: var(--dim);
      text-transform: uppercase; padding: 0 16px 4px;
    }
    .chip-section-lbl:not(:first-child) { padding-top: 10px; }
    .chip-row {
      display: flex; gap: 6px; overflow-x: auto; overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
      padding: 0 16px;
    }
    .chip-row::-webkit-scrollbar { display: none; }
    .chip {
      padding: 0 16px; min-height: 34px; border-radius: 20px; flex-shrink: 0;
      font-size: 10px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase;
      border: 1.5px solid var(--border); background: transparent; color: var(--dim);
      cursor: pointer; white-space: nowrap; display: flex; align-items: center;
      transition: background .12s, color .12s, border-color .12s;
    }
    .chip.active { background: var(--red); border-color: var(--red); color: #fff; box-shadow: 0 2px 10px rgba(232,0,11,0.4); }

    /* ── Toast ───────────────────────────────────────────────── */
    #toast {
      position: fixed; bottom: calc(68px + env(safe-area-inset-bottom, 0px)); left: 50%;
      transform: translateX(-50%) translateY(12px); background: var(--card2);
      border: 1.5px solid var(--border-s);
      border-radius: 100px; padding: 9px 18px; font-size: 13px; font-weight: 700;
      opacity: 0; pointer-events: none; white-space: nowrap; z-index: 200;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    @media (prefers-reduced-motion: no-preference) {
      #toast { transition: opacity .2s, transform .2s; }
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ══════════════════════════════════════════════════════════
       LOGIN

<script>
'use strict';

// ── Config ─────────────────────────────────────────────────
const C = {
  get url()   { return (localStorage.getItem('gc_url')   || '').replace(/\/+$/,'') },
  get token() { return  localStorage.getItem('gc_token') || '' },
  set url(v)  { localStorage.setItem('gc_url',   v.replace(/\/+$/,'')) },
  set token(v){ localStorage.setItem('gc_token', v) },
  get ok()    { return !!(this.url && this.token) },
  clear()     { localStorage.removeItem('gc_url'); localStorage.removeItem('gc_token') },
}

// ── Login ───────────────────────────────────────────────────
function togglePw(id) {
  const el = document.getElementById(id)
  el.type = el.type === 'password' ? 'text' : 'password'
}
async function doLogin() {
  const urlEl=document.getElementById('l-url'), tokEl=document.getElementById('l-token')
  const errEl=document.getElementById('l-error'), btn=document.getElementById('l-btn')
  const url=urlEl.value.trim().replace(/\/+$/,''), token=tokEl.value.trim()
  errEl.textContent=''
  if (!url)   { errEl.textContent='Enter your server URL.';   urlEl.focus(); return }
  if (!token) { errEl.textContent='Enter your access token.'; tokEl.focus(); return }
  btn.disabled=true; btn.innerHTML='<div class="spinner sm"></div> Connecting…'
  try {
    const r=await fetch(url+'/health',{headers:{'Authorization':`Bearer ${token}`}})
    if (r.status===401) { errEl.textContent='Wrong token.'; return }
    if (r.status===429) { errEl.textContent='Too many attempts — wait 60s.'; return }
    if (!r.ok) { errEl.textContent=`Server error ${r.status}.`; return }
    C.url=url; C.token=token
    const ls=document.getElementById('login-screen')
    ls.classList.add('fade-out')
    const enter=()=>{ ls.classList.add('hidden'); loadToday() }
    ls.addEventListener('animationend',enter,{once:true})
    setTimeout(enter,400)
  } catch(e) { errEl.textContent='Could not reach server. Check URL and Tailscale.' }
  finally { btn.disabled=false; btn.innerHTML='Connect' }
}
function doLogout() {
  C.clear(); closeSettings()
  const ls=document.getElementById('login-screen')
  ls.classList.remove('hidden','fade-out')
  document.getElementById('l-url').value=''
  document.getElementById('l-token').value=''
  document.getElementById('l-error').textContent=''
  today_loaded=false; training_loaded=false
}

// ── API ─────────────────────────────────────────────────────
async function api(method, path, body, timeoutMs=25000) {
  const ctrl=new AbortController()
  const timer=setTimeout(()=>ctrl.abort(),timeoutMs)
  try {
    const r=await fetch(C.url+path,{
      method,
      headers:{'Authorization':`Bearer ${C.token}`,'Content-Type':'application/json'},
      body:body!=null?JSON.stringify(body):undefined,
      signal:ctrl.signal,
    })
    if (r.status===401) { doLogout(); throw new Error('Session expired — please sign in again') }
    if (!r.ok) { const t=await r.text().catch(()=>''); throw new Error(t||`HTTP ${r.status}`) }
    return r.json()
  } catch(e) {
    if (e.name==='AbortError') throw new Error('Request timed out — Garmin API may be slow, try again')
    throw e
  } finally {
    clearTimeout(timer)
  }
}

// ── Markdown ────────────────────────────────────────────────
function x(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }
function il(s) {
  return x(s)
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/\*([^*\n]+)\*/g,'<em>$1</em>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
}
function md(text) {
  if (!text) return ''
  let h=''
  for (const ln of text.split('\n')) {
    if (/^[—]\s+.+\s+[—]$/.test(ln.trim())) {
      h+=`<div class="mh">${x(ln.trim().replace(/^[—]\s*/,'').replace(/\s*[—]$/,''))}</div>`
    } else if (/^[-•]\s/.test(ln)) {
      h+=`<div class="mb">${il(ln.slice(2))}</div>`
    } else if (/^\d+\.\s/.test(ln)) {
      h+=`<div class="mb">${il(ln.replace(/^\d+\.\s/,''))}</div>`
    } else if (/^[-─═]{3,}$/.test(ln.trim())) {
      h+=`<div class="mr"></div>`
    } else if (!ln.trim()) {
      h+=`<div class="msp"></div>`
    } else {
      h+=`<div class="ml">${il(ln)}</div>`
    }
  }
  return h
}

// ── Helpers ─────────────────────────────────────────────────
function autoH(el) { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,120)+'px' }
let _tt
function toast(msg) {
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show')
  clearTimeout(_tt); _tt=setTimeout(()=>t.classList.remove('show'),2500)
}
function fmt_date(s) {
  if(!s) return ''
  return new Date(s).toLocaleDateString('en-US',{month:'short',day:'numeric'})
}
function rdy_color(sc) {
  if(!sc) return 'var(--dim)'
  if(sc>=80) return 'var(--green)'
  if(sc>=60) return 'var(--red)'
  return 'var(--orange)'
}
function isRun(type) {
  return (type||'').toLowerCase().match(/run/)
}
function isStrength(type) {
  const t=(type||'').toLowerCase()
  return t.includes('strength')||t.includes('fitness')
}

// ── Date range helpers ──────────────────────────────────────
function rangeToSince(r) {
  const d=new Date()
  switch(r) {
    case '7D': { const t=new Date(d); t.setDate(d.getDate()-6); return t.toISOString().slice(0,10) }
    case '1M': { const t=new Date(d); t.setDate(d.getDate()-29); return t.toISOString().slice(0,10) }
    case '3M': { const t=new Date(d); t.setDate(t.getDate()-90); return t.toISOString().slice(0,10) }
    case '6M': { const t=new Date(d); t.setDate(t.getDate()-180); return t.toISOString().slice(0,10) }
    case '1Y': { const t=new Date(d); t.setDate(t.getDate()-365); return t.toISOString().slice(0,10) }
  }
  const t=new Date(d); t.setDate(d.getDate()-29); return t.toISOString().slice(0,10)
}

// ── Tab switch ──────────────────────────────────────────────
let active_tab='today'
const TABS=['today','training','coach']

function switchTab(name) {
  // Close any open detail view first
  if (name==='training' && trainDetailOpen) closeDetail()
  TABS.forEach(t=>{
    document.getElementById('tab-'+t).classList.toggle('active',t===name)
    document.getElementById('tabbar-'+t).classList.toggle('active',t===name)
  })
  active_tab=name
  renderHeader(name)
  if (name==='today'    && !today_loaded)    loadToday()
  if (name==='training' && !training_loaded) loadTraining()
}

// ── Header ──────────────────────────────────────────────────
const GEAR_SVG=`<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96a7.07 7.07 0 00-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.47.47 0 00-.59.22L2.74 8.87a.47.47 0 00.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.47.47 0 00-.12-.61l-2.01-1.58zM12 15.6a3.6 3.6 0 110-7.2 3.6 3.6 0 010 7.2z"/></svg>`
const SYNC_SVG=`<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>`
const BACK_SVG=`<svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>`

function renderHeader(tab) {
  const titles={today:'TODAY',training:'TRAINING',coach:'COACH'}
  document.getElementById('header-title').textContent=titles[tab]||tab.toUpperCase()
  const left=document.getElementById('header-left')
  left.innerHTML=`<div class="header-title" id="header-title">${titles[tab]||tab.toUpperCase()}</div>`
  const acts=document.getElementById('header-actions')
  if (tab==='today') {
    acts.innerHTML=`
      <button class="icon-btn" onclick="openSettings()" aria-label="Settings">${GEAR_SVG}</button>
      <button class="icon-btn red" onclick="syncAndLoad()" aria-label="Sync">${SYNC_SVG}</button>`
  } else {
    acts.innerHTML=`<button class="icon-btn" onclick="openSettings()" aria-label="Settings">${GEAR_SVG}</button>`
  }
}

function renderDetailHeader(actName) {
  document.getElementById('header-left').innerHTML=`
    <button class="back-btn" onclick="closeDetail()" aria-label="Back to list">
      ${BACK_SVG} Back
    </button>`
  document.getElementById('header-actions').innerHTML=`<button class="icon-btn" onclick="openSettings()" aria-label="Settings">${GEAR_SVG}</button>`
}

// ── Settings ────────────────────────────────────────────────
function openSettings() {
  document.getElementById('s-url').value=C.url
  document.getElementById('s-token').value=C.token
  document.getElementById('cdot').className='cdot'
  document.getElementById('clabel').textContent='Not tested'
  document.getElementById('settings-modal').classList.add('open')
}
function closeSettings() { document.getElementById('settings-modal').classList.remove('open') }
function outsideClose(e) { if(e.target===document.getElementById('settings-modal')) closeSettings() }
async function testConn() {
  const url=document.getElementById('s-url').value.replace(/\/+$/,'')
  const token=document.getElementById('s-token').value
  const dot=document.getElementById('cdot'), lbl=document.getElementById('clabel')
  dot.className='cdot'; lbl.textContent='Testing…'
  try {
    const r=await fetch(url+'/health',{headers:{'Authorization':`Bearer ${token}`}})
    if(r.ok){dot.className='cdot ok';lbl.textContent='Connected ✓'}
    else{dot.className='cdot err';lbl.textContent=`HTTP ${r.status}`}
  } catch(e) { dot.className='cdot err'; lbl.textContent=e.message }
}

      <div class="metric-label"><span class="dot" style="background:var(--orange)"></span>Body Battery</div>

// ── Mileage Chart (line) ─────────────────────────────────────
function renderChart(areaId, acts, range, type) {
  const area=document.getElementById(areaId)
  if (!area) return
  const showDist=type!=='strength'
  const relevantActs=type==='strength'
    ? acts.filter(a=>isStrength(a.type))
    : acts.filter(a=>isRun(a.type)&&(a.distance_km||0)>0)

  if (!relevantActs.length) { area.innerHTML=`<div style="padding:16px 0;text-align:center;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase">No data in this period</div>`; return }

  const today=new Date()
  const todayStr=today.toISOString().slice(0,10)
  const buckets=[]

  if (range==='7D') {
    for (let i=6;i>=0;i--) {
      const d=new Date(today); d.setDate(today.getDate()-i)
      const ds=d.toISOString().slice(0,10)
      buckets.push({start:ds,end:ds,label:d.toLocaleDateString('en-US',{weekday:'short'}),isToday:i===0})
    }
  } else if (range==='1M') {
    for (let i=29;i>=0;i--) {
      const d=new Date(today); d.setDate(today.getDate()-i)
      const ds=d.toISOString().slice(0,10)
      const showLabel=i===29||i===22||i===15||i===8||i===0
      buckets.push({start:ds,end:ds,label:showLabel?d.toLocaleDateString('en-US',{month:'short',day:'numeric'}):'',isToday:i===0})
    }
  } else if (range==='3M') {
    const start=new Date(today); start.setDate(today.getDate()-90)
    const dow=start.getDay(); start.setDate(start.getDate()-(dow===0?6:dow-1))
    let cur=new Date(start),idx=0
    while (cur<=today) {
      const wEnd=new Date(cur); wEnd.setDate(cur.getDate()+6)
      if (wEnd>today) wEnd.setTime(today.getTime())
      const label=idx%2===0?cur.toLocaleDateString('en-US',{month:'short',day:'numeric'}):''
      buckets.push({start:cur.toISOString().slice(0,10),end:wEnd.toISOString().slice(0,10),label,isToday:wEnd.toISOString().slice(0,10)>=todayStr})
      cur.setDate(cur.getDate()+7); idx++
    }
  } else if (range==='6M') {
    const start=new Date(today); start.setDate(today.getDate()-180)
    const dow=start.getDay(); start.setDate(start.getDate()-(dow===0?6:dow-1))
    let cur=new Date(start),lastMonth=-1
    while (cur<=today) {
      const wEnd=new Date(cur); wEnd.setDate(cur.getDate()+6)
      if (wEnd>today) wEnd.setTime(today.getTime())
      const mon=cur.getMonth()
      const label=mon!==lastMonth?cur.toLocaleDateString('en-US',{month:'short'}):''
      if (mon!==lastMonth) lastMonth=mon
      buckets.push({start:cur.toISOString().slice(0,10),end:wEnd.toISOString().slice(0,10),label,isToday:wEnd.toISOString().slice(0,10)>=todayStr})
      cur.setDate(cur.getDate()+7)
    }
  } else {
    for (let i=11;i>=0;i--) {
      const d=new Date(today.getFullYear(),today.getMonth()-i,1)
      const mEnd=new Date(d.getFullYear(),d.getMonth()+1,0)
      if (mEnd>today) mEnd.setTime(today.getTime())
      buckets.push({start:d.toISOString().slice(0,10),end:mEnd.toISOString().slice(0,10),label:d.toLocaleDateString('en-US',{month:'short'}),isToday:i===0})
    }
  }

  buckets.forEach(b=>{
    b.val=showDist
      ?Math.round(relevantActs.filter(a=>a.startTimeLocal&&a.startTimeLocal.slice(0,10)>=b.start&&a.startTimeLocal.slice(0,10)<=b.end).reduce((s,a)=>s+(a.distance_km||0),0)*10)/10
      :relevantActs.filter(a=>a.startTimeLocal&&a.startTimeLocal.slice(0,10)>=b.start&&a.startTimeLocal.slice(0,10)<=b.end).length
  })

  const total=buckets.reduce((s,b)=>s+b.val,0)
  if (!total) { area.innerHTML=`<div style="padding:16px 0;text-align:center;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase">No data in this period</div>`; return }

  const unit=showDist?'km':'sessions'
  const avgPerWeek=range==='1Y'?Math.round(total/52*10)/10
    :range==='6M'?Math.round(total/26*10)/10
    :range==='3M'?Math.round(total/13*10)/10
    :range==='1M'?Math.round(total/4*10)/10
    :total
  const totalDisplay=showDist?total.toFixed(1):total
  const avgDisplay=showDist?avgPerWeek.toFixed(1):avgPerWeek
  const avgLabel=range==='7D'?'this week':'avg/wk'

  const CW=area.clientWidth||(window.innerWidth-32)
  const PL=8,PR=8,PT=12,PB=24
  const plotW=CW-PL-PR, plotH=72, SVG_H=PT+plotH+PB
  const n=buckets.length, maxVal=Math.max(...buckets.map(b=>b.val),1)
  const BLUE='#0A84FF'

  const pts=buckets.map((b,i)=>({
    x:PL+(n>1?i/(n-1)*plotW:plotW/2),
    y:PT+plotH-(b.val/maxVal*plotH),
    b
  }))

  const bot=PT+plotH
  const polyPts=pts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ')
  const areaPath=`M${pts[0].x.toFixed(1)},${bot} `+pts.map(p=>`L${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ')+` L${pts[n-1].x.toFixed(1)},${bot} Z`
  const gradId=`cg-${areaId}`

  let labelsHtml='', dotsHtml=''
  pts.forEach((p,i)=>{
    if (buckets[i].label) labelsHtml+=`<text x="${p.x.toFixed(1)}" y="${SVG_H-3}" font-size="8" fill="rgba(255,255,255,0.4)" font-weight="600" text-anchor="middle" font-family="-apple-system,sans-serif">${buckets[i].label}</text>`
    if (p.b.val>0) {
      const r=p.b.isToday?'4':'2.5'
      dotsHtml+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r}" fill="${BLUE}"${p.b.isToday?` style="filter:drop-shadow(0 0 5px ${BLUE})"`:''}/>`
    }
  })

  area.innerHTML=`<div class="chart-wrap">
    <div class="chart-header">
      <div>
        <div class="chart-ttl">${showDist?'Distance':'Sessions'} · ${range}</div>
        <div class="chart-total">${totalDisplay} <span style="font-size:14px;font-weight:400;color:var(--dim)">${unit}</span></div>
        ${range!=='7D'?`<div class="chart-sub">${avgDisplay} ${unit} ${avgLabel}</div>`:''}
      </div>
    </div>
    <div style="position:relative">
      <svg width="${CW}" height="${SVG_H}" style="display:block;overflow:visible">
        <defs>
          <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="${BLUE}" stop-opacity="0.2"/>
            <stop offset="100%" stop-color="${BLUE}" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <path d="${areaPath}" fill="url(#${gradId})"/>
        <polyline points="${polyPts}" fill="none" stroke="${BLUE}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        ${dotsHtml}
        ${labelsHtml}
        <rect id="hit-${areaId}" x="${PL}" y="${PT}" width="${plotW}" height="${plotH}" fill="transparent" style="cursor:crosshair"/>
        <g id="tip-${areaId}" style="display:none" pointer-events="none">
          <line id="tc-${areaId}" y1="${PT}" y2="${bot}" stroke="rgba(255,255,255,0.18)" stroke-width="1" stroke-dasharray="3,3"/>
          <circle id="td-${areaId}" r="5" fill="${BLUE}" stroke="rgba(255,255,255,0.9)" stroke-width="1.5"/>
          <rect id="tb-${areaId}" rx="5" ry="5" fill="rgba(14,14,14,0.95)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
          <text id="tv-${areaId}" fill="#fff" font-size="10" font-weight="700" font-family="-apple-system,sans-serif" text-anchor="middle"/>
          <text id="tl-${areaId}" fill="rgba(255,255,255,0.5)" font-size="8" font-family="-apple-system,sans-serif" text-anchor="middle"/>
        </g>
      </svg>
    </div>
  </div>`

  const hitEl=document.getElementById(`hit-${areaId}`)
  const tipEl=document.getElementById(`tip-${areaId}`)
  const curEl=document.getElementById(`tc-${areaId}`)
  const dotEl=document.getElementById(`td-${areaId}`)
  const bgEl =document.getElementById(`tb-${areaId}`)
  const valEl=document.getElementById(`tv-${areaId}`)
  const lblEl=document.getElementById(`tl-${areaId}`)
  let hideTimer=null

  function showTip(clientX) {
    const rect=hitEl.closest('svg').getBoundingClientRect()
    const svgX=clientX-rect.left
    let nearest=pts[0],minD=Infinity
    pts.forEach(p=>{ const d=Math.abs(p.x-svgX); if(d<minD){minD=d;nearest=p} })
    const cx=nearest.x,cy=nearest.y
    curEl.setAttribute('x1',cx); curEl.setAttribute('x2',cx)
    dotEl.setAttribute('cx',cx); dotEl.setAttribute('cy',cy)
    const valStr=showDist?nearest.b.val.toFixed(1)+' km':nearest.b.val+(nearest.b.val===1?' session':' sessions')
    const lblStr=nearest.b.label||nearest.b.start
    valEl.textContent=valStr; lblEl.textContent=lblStr
    const bw=Math.max(valStr.length,lblStr.length)*5.6+16, bh=28
    let bx=cx-bw/2
    if (bx<2) bx=2
    if (bx+bw>CW-2) bx=CW-bw-2
    let by=cy-bh-8
    if (by<2) by=2
    bgEl.setAttribute('x',bx); bgEl.setAttribute('y',by); bgEl.setAttribute('width',bw); bgEl.setAttribute('height',bh)
    valEl.setAttribute('x',bx+bw/2); valEl.setAttribute('y',by+12)
    lblEl.setAttribute('x',bx+bw/2); lblEl.setAttribute('y',by+bh-4)
    tipEl.style.display=''
    if (hideTimer) { clearTimeout(hideTimer); hideTimer=null }
  }

  hitEl.addEventListener('pointermove',e=>{e.preventDefault();showTip(e.clientX)},{passive:false})
  hitEl.addEventListener('pointerdown',e=>{e.preventDefault();showTip(e.clientX)},{passive:false})
  hitEl.addEventListener('pointerleave',()=>{ hideTimer=setTimeout(()=>tipEl.style.display='none',600) })
  hitEl.addEventListener('pointerup',  ()=>{ hideTimer=setTimeout(()=>tipEl.style.display='none',1500) })
}

    const zbar=tz>0?`<div class="zone-bar" aria-hidden="true">${
      [[a.hrZ1s,'#4a9eff'],[a.hrZ2s,'#34c759'],[a.hrZ3s,'#ffd60a'],[a.hrZ4s,'#ff9500'],[a.hrZ5s,'#FF1F1F']]

      <div class="act-hdr">

        </div>
      </div>
      <div class="act-stats">
        ${a.distance_km?`<div><div class="st-val">${a.distance_km}</div><div class="st-lbl">km</div></div>`:''}
        ${a.duration_min?`<div><div class="st-val">${Math.round(a.duration_min)}m</div><div class="st-lbl">time</div></div>`:''}
        ${a.averageHR?`<div><div class="st-val">${a.averageHR}</div><div class="st-lbl">avg hr</div></div>`:''}
        ${a.avgCadence?`<div><div class="st-val">${Math.round(a.avgCadence)}</div><div class="st-lbl">spm</div></div>`:''}
        ${a.aerobicTE?`<div><div class="st-val">${a.aerobicTE}</div><div class="st-lbl">aer te</div></div>`:''}
      </div>${zbar}
    </div>`
  }
  b.innerHTML=h
}

// ── Activity Detail ──────────────────────────────────────────
function openDetail(idx) {
  const acts=filteredActs()
  detailAct=acts[idx]
  if (!detailAct) return
  detailMsgs=[]; detailCid=null; detailLoading=false
  renderDetailPanel(false)
  document.getElementById('train-detail').classList.add('open')
  trainDetailOpen=true
  renderDetailHeader(detailAct.name)
}

function openDetailAndAnalyze(idx) {
  openDetail(idx)
  setTimeout(()=>runDetailAnalyze(),100)
}

function closeDetail() {
  document.getElementById('train-detail').classList.remove('open')
  trainDetailOpen=false
  detailAct=null; detailMsgs=[]; detailCid=null
  renderHeader('training')
}

function renderDetailPanel(autoScrollToAnalysis) {
  const a=detailAct
  if (!a) return
  const tp=(a.type||'').replace(/_/g,' ')
  const tz=(a.hrZ1s||0)+(a.hrZ2s||0)+(a.hrZ3s||0)+(a.hrZ4s||0)+(a.hrZ5s||0)
  const zbar=tz>0?`<div class="zone-bar" style="height:4px;margin-top:2px" aria-hidden="true">${
    [[a.hrZ1s,'#4a9eff'],[a.hrZ2s,'#34c759'],[a.hrZ3s,'#ffd60a'],[a.hrZ4s,'#ff9500'],[a.hrZ5s,'#FF1F1F']]
    .filter(z=>z[0]>0).map(z=>`<div class="zone-seg" style="flex:${z[0]};background:${z[1]}"></div>`).join('')
  }</div>`:''

  let statsHtml=''
  const stats=[
    {v:a.distance_km?`${a.distance_km} km`:'—', l:'Distance'},
    {v:a.duration_min?`${Math.round(a.duration_min)}m`:'—', l:'Duration'},
    {v:a.averageHR?`${a.averageHR} bpm`:'—', l:'Avg HR'},
    {v:a.maxHR?`${a.maxHR} bpm`:'—', l:'Max HR'},
    {v:a.avgCadence?`${Math.round(a.avgCadence)}`:'—', l:'Cadence'},
    {v:a.aerobicTE??'—', l:'Aerobic TE'},
  ]
  statsHtml=`<div class="detail-stats-grid">${stats.map(s=>`<div class="detail-stat"><div class="detail-stat-v">${s.v}</div><div class="detail-stat-l">${s.l}</div></div>`).join('')}</div>`

  // Analysis section
  let analysisHtml=''
  if (!detailMsgs.length && !detailLoading) {
    analysisHtml=`<button class="abtn full" id="detail-analyze-btn" onclick="runDetailAnalyze()">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M2 12h2v2H2zm3-4h2v6H5zm3-3h2v9H8zm3-4h2v13h-2z"/></svg>
      Analyze This Activity
    </button>`
  } else if (detailLoading && !detailMsgs.length) {
    analysisHtml=`<div class="bwrap"><div class="typing" aria-label="Analyzing"><div class="tdot"></div><div class="tdot"></div><div class="tdot"></div></div></div>`
  } else {
    analysisHtml=detailMsgs.map(m=>`<div class="bwrap"><div class="bubble ${m.r}">${m.r==='assistant'?md(m.t):x(m.t)}</div></div>`).join('')
    if (detailLoading) analysisHtml+=`<div class="bwrap"><div class="typing"><div class="tdot"></div><div class="tdot"></div><div class="tdot"></div></div></div>`
  }

  const followup=detailMsgs.length&&!detailLoading?`<div style="padding:0 16px 24px;display:flex;flex-direction:column;gap:8px">
    <textarea class="ifield" id="detail-input" placeholder="Ask a follow-up…" rows="1"
      oninput="autoH(this)" onkeydown="dkd(event)"></textarea>
    <button class="abtn full" onclick="detailSend()">Send</button>
  </div>`:''

  document.getElementById('train-detail').innerHTML=`
    <div class="pad gap" style="flex:1">
      <div>
        <div class="detail-act-name">${x(a.name||'Activity')}</div>
        <div class="detail-act-type">${x(tp)} · ${fmt_date(a.startTimeLocal)}</div>
      </div>
      ${zbar}
      ${statsHtml}
      <div class="sec-div"><div class="sec-bar"></div><div class="sec-lbl">Analysis</div></div>
      ${analysisHtml}
    </div>
    ${followup}
  `
}

async function runDetailAnalyze() {
  if (!detailAct || detailLoading) return
  const date=(detailAct.startTimeLocal||'').slice(0,10)
  if (!date) { toast('No date for this activity'); return }
  detailLoading=true; detailMsgs=[]
  renderDetailPanel(true)
  try {
    const d=await api('POST','/analyze',{period:`${date}:${date}`})
    detailCid=d.conversation_id
    detailMsgs=[{r:'assistant',t:d.report}]
  } catch(e) { detailMsgs=[{r:'assistant',t:'Error: '+e.message}] }
  finally { detailLoading=false; renderDetailPanel(true) }
}

async function detailSend() {
  const el=document.getElementById('detail-input')
  if (!el) return
  const t=el.value.trim()
  if (!t||detailLoading) return
  el.value=''; el.style.height='auto'
  detailMsgs.push({r:'user',t}); detailLoading=true; renderDetailPanel(false)
  try {
    const d=await api('POST','/chat',{message:t,conversation_id:detailCid,kind:'analyze'})
    detailCid=d.conversation_id; detailMsgs.push({r:'assistant',t:d.message.content})
  } catch(e) { detailMsgs.push({r:'assistant',t:'Error: '+e.message}) }
  finally { detailLoading=false; renderDetailPanel(false) }
}
function dkd(e) { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();detailSend()} }

// ── COACH ────────────────────────────────────────────────────
let ct='chat', c_reply_kind='ask', c_cid=null, c_msgs=[], c_loading=false

const SUGS=['How\'s my training load this week?','Am I ready for a hard session today?','What pace should I target for easy runs?','How\'s my HRV trend lately?']

function setCoachType(t) {
  ct=t; c_cid=null; c_msgs=[]
  c_reply_kind=(t==='chat'||t==='history')?'ask':'coach'
  document.querySelectorAll('#coach-chip-row .chip').forEach(c=>c.classList.toggle('active',c.dataset.ct===t))
  if (t==='history') { updateUploadBar(); loadCoachHistory(); return }
  renderCoach(); updateUploadBar()
}

async function loadCoachHistory() {
  const area=document.getElementById('coach-msgs')
  area.innerHTML=`<div class="loading-card" style="margin:12px 16px"><div class="spinner"></div><div class="loading-lbl">Loading History</div></div>`
  try {
    const data=await api('GET','/conversations')
    const convs=(data.conversations||[]).filter(c=>c.kind==='coach'||c.kind==='ask')
    if (!convs.length) {
      area.innerHTML=`<div class="empty"><div class="empty-title">No History</div><div class="empty-sub">Past coach and chat sessions will appear here.</div></div>`
      return
    }
    area.innerHTML=`<div class="pad gap">`+convs.map(c=>{
      const badge=c.kind==='ask'?'CHAT':'COACH'
      const dt=c.updated_at?new Date(c.updated_at).toLocaleDateString('en-US',{month:'short',day:'numeric'}):''
      return `<div class="conv-item" onclick="openCoachConversation(${c.id})">
        <div style="display:flex;align-items:center;gap:8px">
          <span class="conv-badge">${badge}</span>
          <span style="font-size:11px;color:var(--dim)">${dt}</span>
        </div>
        <div style="font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${x(c.title||'Session')}</div>
        ${c.preview?`<div style="font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${x(c.preview)}</div>`:''}
      </div>`
    }).join('')+`</div>`
  } catch(e) { area.innerHTML=`<div style="padding:16px">${errBanner(e.message)}</div>` }
}

async function openCoachConversation(id) {
  const area=document.getElementById('coach-msgs')
  area.innerHTML=`<div class="loading-card" style="margin:12px 16px"><div class="spinner"></div><div class="loading-lbl">Loading</div></div>`
  try {
    const conv=await api('GET',`/conversations/${id}`)
    c_cid=conv.id
    c_reply_kind=conv.kind==='ask'?'ask':'coach'
    ct=conv.kind==='ask'?'chat':'history'
    c_msgs=(conv.messages||[]).map(m=>({r:m.role==='user'?'user':'assistant',t:m.content}))
    renderCoach(); updateUploadBar()
  } catch(e) { area.innerHTML=`<div style="padding:16px">${errBanner(e.message)}</div>` }
}

function renderCoach() {
  const area=document.getElementById('coach-msgs')
  if (ct==='history'&&!c_msgs.length) return
  if (!c_msgs.length) {
    if (ct==='chat') {
      area.innerHTML=`
        <div class="empty" style="padding:36px 24px 20px">
          <div style="font-size:44px;line-height:1;margin-bottom:4px" aria-hidden="true">&#x1F4AC;</div>
          <div style="font-size:16px;font-weight:900;letter-spacing:2px">ASK YOUR COACH</div>
          <div style="font-size:13px;color:var(--dim);text-align:center;max-width:260px">Evidence-based answers about your training, recovery, and goals.</div>
        </div>
        <div style="padding:0 16px;display:flex;flex-direction:column;gap:8px;padding-bottom:8px">
          ${SUGS.map(s=>`<button class="sug-btn" onclick="coachSug(${JSON.stringify(s)})"><span>${x(s)}</span><span class="sug-arrow">↗</span></button>`).join('')}
        </div>`
    } else {
      const lbl=ct.replace(/-/g,' ')
      area.innerHTML=`<div class="empty">
        <div class="empty-title">No Session</div>
        <div class="empty-sub">Tap Coach to design a ${x(lbl)} session.</div>
      </div>
      <div style="padding:0 16px 16px"><button class="abtn full" onclick="getCoaching()">Get Coaching</button></div>`
    }
    if (c_loading) area.innerHTML=`<div class="bwrap"><div class="typing" aria-label="Coach is typing"><div class="tdot"></div><div class="tdot"></div><div class="tdot"></div></div></div>`
    return
  }
  area.innerHTML=c_msgs.map(m=>`<div class="bwrap"><div class="bubble ${m.r}">${m.r==='assistant'?md(m.t):x(m.t)}</div></div>`).join('')
  if (c_loading) area.innerHTML+=`<div class="bwrap"><div class="typing"><div class="tdot"></div><div class="tdot"></div><div class="tdot"></div></div></div>`
  if (ct!=='chat'&&ct!=='history'&&!c_loading) area.innerHTML+=`<div style="padding:12px 16px"><button class="abtn full" onclick="getCoaching()">Re-generate</button></div>`
  area.scrollTop=area.scrollHeight
}

function _inferWorkoutType() {
  const text=c_msgs.filter(m=>m.r==='assistant').map(m=>m.t).join(' ')
  if (/lower.?body|calf raise|glute|split squat|step.?up|lunge|single.?leg|hip raise|rdl/i.test(text)) return 'lower-body'
  if (/upper.?body|push.?up|pull.?up|chin.?up|pike|plank|crunch|dip\b/i.test(text)) return 'upper-body'
  if (/strength|dumbbell|kettlebell|barbell|resistance training/i.test(text)) return 'strength'
  if (/weekly plan|full week|multiple session/i.test(text)) return 'weekly'
  if (/\brun|running|zone 2|z2|cadence|\bkm\b|easy run|fartlek|tempo/i.test(text)) return 'running'
  return 'weekly'
}

function updateUploadBar() {
  const bar=document.getElementById('upload-bar')
  if (ct==='history'||!c_msgs.length) { bar.innerHTML=''; return }
  bar.innerHTML=`<button class="upload-btn" id="ubtn" onclick="uploadWorkouts()">↑ UPLOAD TO GARMIN</button>`
}

async function getCoaching() {
  if (c_loading) return
  c_loading=true; c_msgs=[]; renderCoach()
  try {
    const d=await api('POST','/coach',{type:ct,upload:false})
    c_cid=d.conversation_id; c_msgs=[{r:'assistant',t:d.brief}]
    c_reply_kind='coach'
  } catch(e) { c_msgs=[{r:'assistant',t:'Error: '+e.message}] }
  finally { c_loading=false; renderCoach(); updateUploadBar() }
}

async function uploadWorkouts() {
  const type=ct==='chat'?_inferWorkoutType():ct
  const btn=document.getElementById('ubtn')
  if(btn){btn.disabled=true;btn.textContent='UPLOADING…'}
  try {
    const d=await api('POST','/coach',{type,upload:true,conversation_id:c_cid})
    const ws=d.uploaded_workouts||[]
    document.getElementById('upload-bar').innerHTML=`<div class="upload-done">
      <div class="upload-done-ttl">✓ Uploaded to Garmin</div>
      ${ws.map(w=>`<div class="upload-done-row"><span>${x(w.name)}</span><span style="color:var(--dim)">${x(w.date)}</span></div>`).join('')}
      <div style="font-size:12px;color:var(--muted);margin-top:4px">Sync your watch via the Connect app.</div>
    </div>`
    if(d.brief){c_msgs[0]={r:'assistant',t:d.brief};renderCoach()}
  } catch(e) { if(btn){btn.disabled=false;btn.textContent='↑ UPLOAD TO GARMIN'} toast(e.message) }
}

async function coachSend() {
  const el=document.getElementById('coach-input'), t=el.value.trim()
  if(!t||c_loading) return; el.value=''; el.style.height='auto'; await cSendMsg(t)
}
async function coachSug(t) { await cSendMsg(t) }
async function cSendMsg(text) {
  c_msgs.push({r:'user',t:text}); c_loading=true; renderCoach()
  try {
    const d=await api('POST','/chat',{message:text,conversation_id:c_cid,kind:c_reply_kind})
    c_cid=d.conversation_id; c_msgs.push({r:'assistant',t:d.message.content})
  } catch(e) { c_msgs.push({r:'assistant',t:'Error: '+e.message}) }
  finally { c_loading=false; renderCoach() }
}
function ckd(e) { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();coachSend()} }

// ── Error helper ─────────────────────────────────────────────
function errBanner(msg) {
  return `<div class="banner error"><div class="banner-bar"></div><div style="font-size:14px">${x(msg)}</div></div>`
}

// ── Boot ─────────────────────────────────────────────────────
renderHeader('today')
if (C.ok) {
  document.getElementById('login-screen').classList.add('hidden')
  loadToday()
} else {
  setTimeout(()=>document.getElementById('l-url').focus(),100)
}
document.getElementById('l-url').addEventListener('keydown',e=>{
  if(e.key==='Enter') document.getElementById('l-token').focus()
})
document.getElementById('l-token').addEventListener('keydown',e=>{
  if(e.key==='Enter') doLogin()
})
</script>
